name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test, publish and build MSI
        shell: pwsh
        run: ./build/build.ps1
      # To sign: import a code-signing certificate into the runner's store from a secret,
      # then run ./build/build.ps1 -CertificateThumbprint <thumbprint>.
      - uses: actions/upload-artifact@v4
        with:
          name: UpdateAllWin-msi
          path: artifacts/installer/*.msi
